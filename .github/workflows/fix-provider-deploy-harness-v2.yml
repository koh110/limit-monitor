name: Apply deploy provider harness fix

on:
  push:
    branches:
      - feature/grok-usage
    paths:
      - .github/workflows/fix-provider-deploy-harness-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/grok-usage
      - run: python .github/scripts/fix-provider-deploy-harness.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/deploy.sh
          git diff --cached --quiet && exit 0
          git commit -m "fix(deploy): keep provider validation harness-safe"
          git push origin HEAD:feature/grok-usage

# retrigger
