name: Patch provider deploy option

on:
  push:
    branches:
      - feature/grok-usage
    paths:
      - .github/workflows/patch-provider-deploy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/grok-usage
      - name: Patch deploy.sh
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('deploy/deploy.sh')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'DEPLOY_SERVICES="${DEPLOY_SERVICES:-server,collector}"\nINSTALL_SERVER=0\nINSTALL_COLLECTOR=0\n',
              'DEPLOY_SERVICES="${DEPLOY_SERVICES:-server,collector}"\n# deploy option 由来の collector provider。空なら collector.env を使う。\nDEPLOY_COLLECTOR_PROVIDERS="${DEPLOY_COLLECTOR_PROVIDERS:-}"\nDEPLOY_COLLECTOR_PROVIDERS_ARG_SEEN=0\nINSTALL_SERVER=0\nINSTALL_COLLECTOR=0\n'
          )

          provider_list_has = '''provider_list_has() {
            local wanted="$1"
            local raw="$2"
            local element
            local parts=()
            local IFS=','
            read -r -a parts <<< "$raw"
            for element in "${parts[@]}"; do
              element="$(trim_space "$element")"
              if [[ "$element" == "$wanted" ]]; then
                return 0
              fi
            done
            return 1
          }
          '''
          provider_helpers = provider_list_has + '''
          # provider list を検証・正規化する。CLI option と collector.env の双方で
          # 同じ許可集合 / 空要素 / 重複ルールを使う。
          normalize_collector_providers() {
            local raw="$1"
            local source="${2:-COLLECTOR_PROVIDERS}"
            local element
            local -a parts=()
            local -a normalized=()
            local -A seen=()

            raw="$(trim_space "$raw")"
            [[ -n "$raw" ]] \\
              || die "${source} must list at least one provider (allowed: codex, claude, grok)"
            if [[ "$raw" == *\\\"* || "$raw" == *\\'* ]]; then
              die "${source} must not contain quotes (got: ${raw})"
            fi

            local rest="$raw"
            local trailing_empty=0
            if [[ "$rest" == *, ]]; then
              rest="${rest%,}"
              trailing_empty=1
            fi
            while [[ -n "$rest" ]]; do
              case "$rest" in
                *,*) parts+=("${rest%%,*}"); rest="${rest#*,}" ;;
                *) parts+=("$rest"); rest="" ;;
              esac
            done
            if [[ "$trailing_empty" -eq 1 ]]; then
              parts+=("")
            fi

            for element in "${parts[@]}"; do
              element="$(trim_space "$element")"
              [[ -n "$element" ]] \\
                || die "${source} contains an empty provider entry (got: ${raw})"
              case "$element" in
                codex|claude|grok) ;;
                *) die "${source} contains an unknown provider '${element}' (allowed: codex, claude, grok)" ;;
              esac
              [[ -z "${seen[$element]:-}" ]] \\
                || die "${source} contains a duplicate provider '${element}' (got: ${raw})"
              seen["$element"]=1
              normalized+=("$element")
            done

            local IFS=','
            printf '%s' "${normalized[*]}"
          }

          # deploy option が指定されていればそれを実効値とし、未指定なら従来どおり
          # collector.env の COLLECTOR_PROVIDERS を使う。
          effective_collector_providers() {
            local env_file="$1"
            if [[ -n "${DEPLOY_COLLECTOR_PROVIDERS}" ]]; then
              printf '%s' "${DEPLOY_COLLECTOR_PROVIDERS}"
              return 0
            fi
            read_env_value "$env_file" COLLECTOR_PROVIDERS ''
          }
          '''
          replace_once(provider_list_has, provider_helpers)

          old_render = '''render_initial_collector_cli_bins() {
            local temp_env="$1"
            local codex_path claude_path

            codex_path="$(resolve_collector_cli_path CODEX_BIN codex)" \\
              || die "codex CLI not found in ${INSTALL_USER} environment (resolve: runuser -u ${INSTALL_USER} -- <user_shell> -lc 'command -v -- codex')"
            claude_path="$(resolve_collector_cli_path CLAUDE_BIN claude)" \\
              || die "claude CLI not found in ${INSTALL_USER} environment (resolve: runuser -u ${INSTALL_USER} -- <user_shell> -lc 'command -v -- claude')"

            sed -i \\
              -e "s|^CODEX_BIN=.*|CODEX_BIN=${codex_path}|" \\
              -e "s|^CLAUDE_BIN=.*|CLAUDE_BIN=${claude_path}|" \\
              "$temp_env"
            log "initial install: rendered resolved CLI paths into temp env (CODEX_BIN=${codex_path}, CLAUDE_BIN=${claude_path})"
          }
          '''
          new_render = '''render_initial_collector_cli_bins() {
            local temp_env="$1"
            local providers codex_path claude_path
            providers="$(normalize_collector_providers "$(effective_collector_providers "$temp_env")" 'collector providers')"

            # 選択された CLI provider だけを解決する。grok はローカル billing log を
            # 読むため vendor CLI path の検証を必要としない。
            if provider_list_has "codex" "$providers"; then
              codex_path="$(resolve_collector_cli_path CODEX_BIN codex)" \\
                || die "codex CLI not found in ${INSTALL_USER} environment (resolve: runuser -u ${INSTALL_USER} -- <user_shell> -lc 'command -v -- codex')"
              sed -i "s|^CODEX_BIN=.*|CODEX_BIN=${codex_path}|" "$temp_env"
              log "initial install: rendered resolved Codex CLI path into temp env (CODEX_BIN=${codex_path})"
            fi
            if provider_list_has "claude" "$providers"; then
              claude_path="$(resolve_collector_cli_path CLAUDE_BIN claude)" \\
                || die "claude CLI not found in ${INSTALL_USER} environment (resolve: runuser -u ${INSTALL_USER} -- <user_shell> -lc 'command -v -- claude')"
              sed -i "s|^CLAUDE_BIN=.*|CLAUDE_BIN=${claude_path}|" "$temp_env"
              log "initial install: rendered resolved Claude CLI path into temp env (CLAUDE_BIN=${claude_path})"
            fi
          }
          '''
          replace_once(old_render, new_render)

          replace_once(
              'providers="$(read_env_value "$env_file" COLLECTOR_PROVIDERS \'\')"\n  [[ -n "$providers" ]] \\\n    || die "COLLECTOR_PROVIDERS is empty in ${env_file} (set a comma-separated list from codex,claude)"',
              'providers="$(normalize_collector_providers "$(effective_collector_providers "$env_file")" "collector providers (${env_file})")"\n  [[ -n "$providers" ]] \\\n    || die "collector providers are empty in ${env_file} (allowed: codex, claude, grok)"'
          )
          replace_once(
              'if [[ "$element" != "codex" && "$element" != "claude" ]]; then\n      die "COLLECTOR_PROVIDERS has an unknown provider \'${element}\' in ${env_file} (allowed: codex, claude)"\n    fi',
              'if [[ "$element" != "codex" && "$element" != "claude" && "$element" != "grok" ]]; then\n      die "COLLECTOR_PROVIDERS has an unknown provider \'${element}\' in ${env_file} (allowed: codex, claude, grok)"\n    fi'
          )

          replace_once(
              '    --services) DEPLOY_SERVICES="${2:-}"; shift 2 ;;\n',
              '    --services) DEPLOY_SERVICES="${2:-}"; shift 2 ;;\n    --providers)\n      [[ "${DEPLOY_COLLECTOR_PROVIDERS_ARG_SEEN}" -eq 0 ]] || die "--providers is specified more than once"\n      [[ -n "${2:-}" ]] || die "--providers requires a comma-separated list from codex,claude,grok"\n      DEPLOY_COLLECTOR_PROVIDERS="${2}"\n      DEPLOY_COLLECTOR_PROVIDERS_ARG_SEEN=1\n      shift 2\n      ;;\n'
          )

          replace_once(
              'resolve_selected_services\nlog "selected services: $(selected_unit_templates | tr \'\\n\' \' \')"\n',
              'resolve_selected_services\nif [[ -n "${DEPLOY_COLLECTOR_PROVIDERS}" ]]; then\n  [[ "${INSTALL_COLLECTOR}" -eq 1 ]] || die "--providers requires the collector service to be selected"\n  DEPLOY_COLLECTOR_PROVIDERS="$(normalize_collector_providers "${DEPLOY_COLLECTOR_PROVIDERS}" \'--providers\')"\n  log "collector providers selected by deploy option: ${DEPLOY_COLLECTOR_PROVIDERS}"\nfi\nlog "selected services: $(selected_unit_templates | tr \'\\n\' \' \')"\n'
          )

          marker = '''  if [[ "${unit_name}" == "limit-monitor-collector.service" ]]; then
            local unit_type rendered_type
            unit_type="$(collector_unit_type)"
          '''
          replacement = '''  if [[ "${unit_name}" == "limit-monitor-collector.service" ]]; then
            local unit_type rendered_type
            # --providers 指定時は EnvironmentFile より後ろに Environment= を追加し、
            # env ファイルを編集せず deploy 時の選択を実効設定として固定する。
            if [[ -n "${DEPLOY_COLLECTOR_PROVIDERS}" ]]; then
              local env_file_line_count
              env_file_line_count="$(grep -c '^EnvironmentFile=-/etc/limit-monitor/collector.env$' "$out" || true)"
              [[ "${env_file_line_count}" -eq 1 ]] \\
                || die "${unit_name} must contain exactly one collector EnvironmentFile line to apply --providers (got: ${env_file_line_count})"
              sed -i "/^EnvironmentFile=-\\/etc\\/limit-monitor\\/collector.env$/a Environment=COLLECTOR_PROVIDERS=${DEPLOY_COLLECTOR_PROVIDERS}" "$out"
              grep -qxF "Environment=COLLECTOR_PROVIDERS=${DEPLOY_COLLECTOR_PROVIDERS}" "$out" \\
                || die "failed to render collector providers into ${unit_name}"
            fi
            unit_type="$(collector_unit_type)"
          '''
          replace_once(marker, replacement)

          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/deploy.sh
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "feat(deploy): apply provider selection without env edits"
          git push origin HEAD:feature/grok-usage
