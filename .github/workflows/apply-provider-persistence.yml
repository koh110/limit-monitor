name: Apply provider persistence fix

on:
  push:
    branches:
      - fix/persist-deploy-providers
    paths:
      - .github/workflows/apply-provider-persistence.yml
      - .github/scripts/persist-deploy-providers.py
      - deploy/provider-config.ts
      - test/provider-config.test.ts
      - package.json
      - tsconfig.json

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/persist-deploy-providers
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.x
      - run: python .github/scripts/persist-deploy-providers.py
      - run: bash -n deploy/deploy.sh
      - run: npm ci
      - run: npm run format
      - run: npm run format-check
      - run: npm run lint
      - run: npm run tsc
      - run: npm run test:deploy
      - run: npm run build -w shared
      - run: npm run build -w hub
      - run: npm run tsc -w hub
      - run: npm run test-ci -w hub
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/deploy.sh deploy/provider-config.ts test/provider-config.test.ts package.json tsconfig.json
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix(deploy): persist provider selection in collector env"
          git push origin HEAD:fix/persist-deploy-providers
