name: Format deploy TypeScript once

on:
  push:
    branches:
      - fix/persist-deploy-providers
    paths:
      - .github/workflows/format-deploy-ts.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/persist-deploy-providers
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.x
      - run: npm ci
      - run: npm run format
      - name: Commit formatted files and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-deploy-ts.yml
          git add package.json deploy.ts deploy/*.ts packages
          git diff --cached --check
          git commit -m "style(deploy): format TypeScript deploy implementation"
          git push origin HEAD:fix/persist-deploy-providers
